<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — Noyala</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fbf8f4;
        color: #231f20;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #6b6560;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      button {
        margin-top: 1.5rem;
        background: #b5654a;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 0.6rem 1.25rem;
        font-size: 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Noyala needs a connection to show your people, dates and memories.
        Reconnect and try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
